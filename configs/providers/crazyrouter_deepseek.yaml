# Sentry configuration for CrazyRouter DeepSeek Flash
# Shared backbone for detection and recovery
api:
  provider: openai_compatible
  model: deepseek-flash
  base_url: https://api.lhcwn.pro/v1
  api_key_env: CRAZYROUTER_API_KEY
  json_mode: native
  timeout: 120.0
  max_retries: 2

model:
  model: deepseek-flash
  temperature: 0.0
  max_tokens: 4096
  structured_outputs: true

task_agent:
  temperature: 0.7
  max_tokens: 1024
  structured_outputs: false

trace:
  window_size: 5
  post_rescue_horizon: 10
