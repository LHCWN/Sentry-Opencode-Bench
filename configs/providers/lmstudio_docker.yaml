# Sentry configuration for LM Studio running on host machine from inside Docker
# Using google/gemma-4-e4b
api:
  provider: openai_compatible
  model: google/gemma-4-e4b
  base_url: http://host.docker.internal:1234/v1
  api_key_env: null
  json_mode: prompt
  timeout: 120.0
  max_retries: 0

model:
  model: google/gemma-4-e4b
  temperature: 0.0
  max_tokens: 1536
  structured_outputs: true

task_agent:
  temperature: 0.7
  max_tokens: 1024
  structured_outputs: false

trace:
  window_size: 5
  post_rescue_horizon: 10
