api:
  provider: openai_compatible
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  base_url: http://127.0.0.1:8000/v1
  api_key_env: null
  json_mode: prompt
  timeout: 120.0
  max_retries: 2

model:
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  temperature: 0.0
  max_tokens: 1536
  structured_outputs: true

task_agent:
  temperature: 0.7
  max_tokens: 1024
  structured_outputs: false

trace:
  window_size: 5
  post_rescue_horizon: 10
